version: "3.9"

networks:
  anivoy-shared-net:
    external: true

services:
  game:
    build:
      context: .
      target: development
    container_name: anivoy-game-service
    ports:
      - "7300:7300"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - anivoy-shared-net
